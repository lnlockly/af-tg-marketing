[project]
name = "tg-engine"
version = "0.1.0"
description = "Lightweight Telegram marketing engine (Telethon + asyncio + SQLite). Per-pod, agent-driven."
requires-python = ">=3.10"
dependencies = [
    "telethon==1.36.0",
    "PySocks==1.7.1",
    "sqlmodel==0.0.22",
    "openai>=1.40",          # points at the AgentFlow LLM gateway (OpenAI-compatible)
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["tgengine*"]
